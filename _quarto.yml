project:
  type: website
  pre-render: _processing/pre_render.py
  render: 
    - index.qmd
    - gallery/project_gallery.qmd
    - gallery/*/*/*/*.qmd
    - project/*
    - community/community.qmd
    - python/*
    - qgis/*
    - r/*

website:
  open-graph: true
  title: "UQ Library Training Intensives"
  favicon: "/int_laptop_icon.svg"
  navbar:
    search: true
    tools:
      - icon: github
        menu:
          - text: Source
            href: https://github.com/uqlibrary/technology-training-intensives
          - text: Report an issue
            href: https://github.com/uqlibrary/technology-training-intensives/issues/new
    left:
      - text: "R"
        href: r/setup.md
      - text: "QGIS"
        href: qgis/setup.md
      - text: "Python"
        href: python/setup.md
      - text: "Project Gallery"
        href: gallery/project_gallery.qmd
      - text: "UQL Technology Training"
        href: https://uqlibrary.github.io/technology-training
      - text: "Communities of Practice "
        href: community/community.qmd
      # - text: "**Book for Feb 2026**"
      #   href: https://studenthub.uq.edu.au/students/events/detail/5909456
  sidebar:   
    - title: "R with RStudio"
      collapse-level: 2
      contents:
        - r/setup.md
        - auto: "r/Essentials"
        - auto: "r/Advanced topics"
        - r/7-your_own_data.qmd
        - section: "The Project"
          contents: "project"

    - title: "QGIS"
      collapse-level: 2
      contents:
        - qgis/setup.md
        - auto: "qgis/Essentials"
        - auto: "qgis/Advanced topics"
        - auto: "qgis/The Project"

    - title: "Python for Data Analysis"
      collapse-level: 2
      contents:
        - python/setup.md
        - auto: "python/Essentials"
        - auto: "python/Advanced topics"
        - python/7-your_own_data.qmd
        - section: "The Project"
          contents: "project"
    
format:
  html:
    theme: 
      - default
      - custom.scss
    toc: true
    embed-resources: false

execute:
  freeze: auto